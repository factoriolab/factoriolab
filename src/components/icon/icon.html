@let _faIcon = faIcon();
@let _src = src();
@let _icon = icon();
@if (icon(); as _icon) {
  <span
    class="size-16 absolute origin-top-left"
    [class.scale-50]="!full()"
    [style.zoom.%]="zoom"
    [style.background-image]="_icon.image"
    [style.background-position]="_icon.position"
    [class.light:invert]="_icon.color | isLight"
  >
  </span>

  @if (_icon.quality; as q) {
    <lab-icon
      class="top-2 right-2"
      type="quality"
      [value]="q.id"
      [full]="full()"
    ></lab-icon>
  }
} @else if (_faIcon) {
  <fa-icon [icon]="_faIcon" class="size-8" size="xl"></fa-icon>
} @else if (_src) {
  <img class="w-8" [src]="_src" [alt]="alt()" />
}

@if (_icon?.text ?? iconText(); as text) {
  <span
    class="top-0 left-0 text-sm/3.5 font-semibold text-white text-shadow-black pointer-events-none absolute select-none text-shadow-solid"
    >{{ text }}</span
  >
}

@if (alt(); as text) {
  <span
    class="top-0 right-0 text-sm/3.5 font-semibold text-white text-shadow-black pointer-events-none absolute select-none text-shadow-solid"
    >{{ text }}</span
  >
}

@if (text(); as text) {
  <span
    class="right-0 bottom-0 text-sm/3.5 font-semibold text-white text-shadow-black pointer-events-none absolute select-none text-shadow-solid"
    >{{ text }}</span
  >
}
