<table class="table">
  <thead>
    <tr>
      <th id="mod-header">{{ 'versions.mod' | translate }}</th>
      <th id="version-header">{{ 'versions.version' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <input
          #mod
          type="text"
          aria-labelledby="mod-header"
          class="input"
          [placeholder]="'versions.mod' | translate"
        />
      </td>
      <td>
        <input
          #version
          type="text"
          aria-labelledby="version-header"
          class="input"
          [placeholder]="'versions.version' | translate"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          [aria-label]="'save' | translate"
          (click)="edit().data.version[mod.value] = version.value"
        ></button>
      </td>
    </tr>
    @for (kv of edit().data.version | keyvalue; track kv.key) {
      <tr>
        <td>
          <input
            type="text"
            class="input"
            [ngModel]="kv.key"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="changeKey(kv.key, $event)"
          />
        </td>
        <td>
          <input
            type="text"
            class="input"
            [ngModel]="kv.value"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="edit().data.version[kv.key] = $event"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            [aria-label]="'delete' | translate"
            (click)="remove(kv.key)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>
