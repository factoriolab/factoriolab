<table class="table">
  <thead>
    <tr>
      <th id="id-header">{{ 'editor.id' | translate }}</th>
      <th id="name-header">{{ 'data.name' | translate }}</th>
      <th id="icon-header">{{ 'editor.icon' | translate }}</th>
      <th id="icon-text-header">{{ 'editor.iconText' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <input
          type="text"
          aria-labelledby="id-header"
          class="input"
          [placeholder]="'editor.id' | translate"
          [(ngModel)]="model.id"
        />
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="name-header"
          class="input"
          [placeholder]="'data.name' | translate"
          [(ngModel)]="model.name"
        />
      </td>
      <td>
        <div class="flex items-center">
          <lab-select
            [options]="iconOptions()"
            [iconOnly]="true"
            [(ngModel)]="model.icon"
          ></lab-select>
        </div>
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="icon-text-header"
          class="input"
          [placeholder]="'editor.iconText' | translate"
          [(ngModel)]="model.iconText"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          [aria-label]="'save' | translate"
          (click)="add()"
        ></button>
      </td>
    </tr>
    @for (category of edit().data.categories; track category.id) {
      <tr>
        <td>
          <input
            type="text"
            class="input"
            [placeholder]="'editor.id' | translate"
            [ngModel]="category.id"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="changeId(category, $event)"
          />
        </td>
        <td>
          <input
            type="text"
            class="input"
            [placeholder]="'data.name' | translate"
            [(ngModel)]="category.name"
          />
        </td>
        <td>
          <div class="flex items-center">
            <lab-select
              [options]="iconOptions()"
              [iconOnly]="true"
              [ngModel]="category.icon ?? category.id"
              (ngModelChange)="
                category.icon = $event === category.id ? undefined : $event
              "
            ></lab-select>
          </div>
        </td>
        <td>
          <input
            type="text"
            class="input"
            [placeholder]="'editor.iconText' | translate"
            [(ngModel)]="category.iconText"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            [aria-label]="'delete' | translate"
            (click)="remove(category.id)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>
