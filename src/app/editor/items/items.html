<table class="lab-table">
  <thead>
    <tr>
      <th></th>
      <th id="id-header">{{ 'editor.id' | translate }}</th>
      <th id="name-header">{{ 'data.name' | translate }}</th>
      <th id="icon-header">{{ 'editor.icon' | translate }}</th>
      <th id="icon-text-header">{{ 'editor.iconText' | translate }}</th>
      <th id="category-header">{{ 'data.category' | translate }}</th>
      <th id="row-header">{{ 'editor.row' | translate }}</th>
      <th colspan="2"></th>
    </tr>
  </thead>
  <tbody cdkDropList (cdkDropListDropped)="drop($event)">
    <tr>
      <td></td>
      <td>
        <input
          type="text"
          aria-labelledby="id-header"
          class="input"
          [placeholder]="'editor.id' | translate"
          [(ngModel)]="model.id"
        />
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="name-header"
          class="input"
          [placeholder]="'data.name' | translate"
          [(ngModel)]="model.name"
        />
      </td>
      <td>
        <div class="flex items-center">
          <lab-select
            labelledBy="icon-header"
            [options]="iconOptions()"
            [iconOnly]="true"
            [(ngModel)]="model.icon"
          />
        </div>
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="icon-text-header"
          class="input"
          size="2"
          [placeholder]="'editor.iconText' | translate"
          [(ngModel)]="model.iconText"
        />
      </td>
      <td>
        <div class="flex items-center">
          <lab-select
            labelledBy="category-header"
            [options]="categoryOptions()"
            [iconOnly]="true"
            [(ngModel)]="model.category"
          />
        </div>
      </td>
      <td>
        <input
          type="number"
          aria-labelledby="row-header"
          class="input"
          size="2"
          [placeholder]="'editor.row' | translate"
          [(ngModel)]="model.row"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faPencil"
          [aria-label]="'edit' | translate"
          (click)="editItem(model)"
        ></button>
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          color="brand"
          [aria-label]="'save' | translate"
          (click)="add()"
        ></button>
      </td>
    </tr>
    @for (item of edit().data.items; track item.id; let index = $index) {
      <tr cdkDrag cdkDragLockAxis="y">
        <td
          cdkDragHandle
          class="cursor-grab hover:bg-gray-800 active:cursor-grabbing"
        >
          <fa-icon [icon]="faGrip" />
          <ng-container *cdkDragPreview>
            <div
              class="gap-2 rounded-xs p-2 flex items-center border border-gray-700 bg-gray-900"
            >
              <fa-icon [icon]="faGrip" />
              <img
                class="w-8"
                [src]="edit().icons[item.icon ?? item.id]?.url"
                [alt]="item.name"
              />
              <span>{{ item.name }}</span>
            </div>
          </ng-container>
        </td>
        <td>
          <input
            type="text"
            class="input"
            [placeholder]="'editor.id' | translate"
            [ngModel]="item.id"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="changeId(item, $event)"
          />
        </td>
        <td>
          <input
            type="text"
            class="input"
            [placeholder]="'data.name' | translate"
            [(ngModel)]="item.name"
          />
        </td>
        <td>
          <div class="flex items-center">
            <lab-select
              [options]="iconOptions()"
              [iconOnly]="true"
              [ngModel]="item.icon ?? item.id"
              (ngModelChange)="
                item.icon = $event === item.id ? undefined : $event
              "
            />
          </div>
        </td>
        <td>
          <input
            type="text"
            class="input"
            size="2"
            [placeholder]="'editor.iconText' | translate"
            [(ngModel)]="item.iconText"
          />
        </td>
        <td>
          <div class="flex items-center">
            <lab-select
              [options]="categoryOptions()"
              [iconOnly]="true"
              [(ngModel)]="item.category"
            />
          </div>
        </td>
        <td>
          <input
            type="number"
            aria-labelledby="row-header"
            class="input"
            size="2"
            [placeholder]="'editor.row' | translate"
            [(ngModel)]="item.row"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faPencil"
            [aria-label]="'edit' | translate"
            (click)="editItem(item, index)"
          ></button>
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            color="complement"
            [aria-label]="'delete' | translate"
            (click)="remove(item.id)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>
