<table class="lab-table">
  <thead>
    <tr>
      <th id="recipe-header">{{ 'data.recipe' | translate }}</th>
      <th id="value-header">{{ 'data.value' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <lab-select
          class="w-full"
          [options]="data.recipeOptions"
          [(ngModel)]="model.id"
        />
      </td>
      <td>
        <input
          type="number"
          aria-labelledby="value-header"
          class="input"
          size="3"
          [placeholder]="'data.value' | translate"
          [(ngModel)]="model.value"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          color="brand"
          [aria-label]="'save' | translate"
          (click)="add()"
        ></button>
      </td>
    </tr>
    @for (entry of data.recipeProductivity; track $index; let index = $index) {
      <tr>
        <td>
          <lab-select
            class="w-full"
            [options]="data.recipeOptions"
            [(ngModel)]="entry.id"
          />
        </td>
        <td>
          <input
            type="number"
            aria-labelledby="value-header"
            class="input"
            size="3"
            [placeholder]="'data.value' | translate"
            [(ngModel)]="entry.value"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            color="complement"
            [aria-label]="'delete' | translate"
            (click)="remove(index)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>

<div class="gap-1 sm:gap-2 flex justify-end">
  <button
    type="button"
    labButton
    color="complement"
    [faIcon]="faTrash"
    [text]="'delete' | translate"
    (click)="dialogRef.close(null)"
  ></button>
  <button
    type="button"
    labButton
    color="brand"
    [faIcon]="faFloppyDisk"
    [text]="'save' | translate"
    (click)="dialogRef.close(data.recipeProductivity)"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faXmark"
    [text]="'cancel' | translate"
    (click)="dialogRef.close()"
  ></button>
</div>
