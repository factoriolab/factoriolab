<table class="lab-table">
  <thead>
    <tr>
      <th id="value-header">{{ 'data.value' | translate }}</th>
      <th id="category-header">{{ 'data.category' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <input
          type="number"
          aria-labelledby="value-header"
          class="input"
          size="3"
          [placeholder]="'data.value' | translate"
          [(ngModel)]="model.value"
        />
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="category-header"
          class="input"
          [placeholder]="'data.category' | translate"
          [ngModel]="model.category"
          [ngModelOptions]="{ updateOn: 'blur' }"
          (ngModelChange)="model.category = $event || undefined"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          color="brand"
          [aria-label]="'save' | translate"
          (click)="add()"
        ></button>
      </td>
    </tr>
    @for (entry of data; track $index; let index = $index) {
      <tr>
        <td>
          <input
            type="number"
            aria-labelledby="value-header"
            class="input"
            size="3"
            [placeholder]="'data.value' | translate"
            [(ngModel)]="entry.value"
          />
        </td>
        <td>
          <input
            type="text"
            aria-labelledby="category-header"
            class="input"
            [placeholder]="'data.category' | translate"
            [ngModel]="entry.category"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="entry.category = $event || undefined"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            color="complement"
            [aria-label]="'delete' | translate"
            (click)="remove(index)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>

<div class="gap-1 sm:gap-2 flex justify-end">
  <button
    type="button"
    labButton
    color="complement"
    [faIcon]="faTrash"
    [text]="'delete' | translate"
    (click)="dialogRef.close(null)"
  ></button>
  <button
    type="button"
    labButton
    color="brand"
    [faIcon]="faFloppyDisk"
    [text]="'save' | translate"
    (click)="dialogRef.close(data)"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faXmark"
    [text]="'cancel' | translate"
    (click)="dialogRef.close()"
  ></button>
</div>
