<table class="lab-table">
  <tbody>
    <tr>
      <th id="parts-header">{{ 'data.rocketPartsRequired' | translate }}</th>
      <td>
        <input
          type="text"
          aria-labelledby="parts-header"
          class="input"
          required
          [placeholder]="'data.rocketPartsRequired' | translate"
          [ngModel]="data.parts"
          [ngModelOptions]="{ updateOn: 'blur' }"
          (ngModelChange)="data.parts = toNumeric($event)"
        />
      </td>
    </tr>
    <tr>
      <th id="launch-header">{{ 'editor.rocketLaunchTime' | translate }}</th>
      <td>
        <input
          type="text"
          aria-labelledby="launch-header"
          class="input"
          required
          [placeholder]="'editor.rocketLaunchTime' | translate"
          [ngModel]="data.launch"
          [ngModelOptions]="{ updateOn: 'blur' }"
          (ngModelChange)="data.launch = toNumeric($event)"
        />
      </td>
    </tr>
    <tr>
      <th id="buffered-header">{{ 'data.buffered' | translate }}</th>
      <td>
        <lab-checkbox
          [ngModel]="data.buffered === true"
          (ngModelChange)="data.buffered = $event ? true : undefined"
        ></lab-checkbox>
      </td>
    </tr>
  </tbody>
</table>

<div class="gap-1 sm:gap-2 flex justify-end">
  <button
    type="button"
    labButton
    color="complement"
    [faIcon]="faTrash"
    [text]="'delete' | translate"
    (click)="dialogRef.close(null)"
  ></button>
  <button
    type="button"
    labButton
    color="brand"
    [faIcon]="faFloppyDisk"
    [text]="'save' | translate"
    (click)="dialogRef.close(data)"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faXmark"
    [text]="'cancel' | translate"
    (click)="dialogRef.close()"
  ></button>
</div>
