<table class="lab-table">
  <tbody>
    <tr>
      <th id="capacity-header">{{ 'data.fluidCapacity' | translate }}</th>
      <td>
        <input
          type="text"
          aria-labelledby="capacity-header"
          class="input"
          required
          [placeholder]="'data.fluidCapacity' | translate"
          [ngModel]="data.capacity"
          [ngModelOptions]="{ updateOn: 'blur' }"
          (ngModelChange)="data.capacity = toNumeric($event)"
        />
      </td>
    </tr>
  </tbody>
</table>

<div class="gap-1 sm:gap-2 flex justify-end">
  <button
    type="button"
    labButton
    color="complement"
    [faIcon]="faTrash"
    [text]="'delete' | translate"
    (click)="dialogRef.close(null)"
  ></button>
  <button
    type="button"
    labButton
    color="brand"
    [faIcon]="faFloppyDisk"
    [text]="'save' | translate"
    (click)="dialogRef.close(data)"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faXmark"
    [text]="'cancel' | translate"
    (click)="dialogRef.close()"
  ></button>
</div>
