@if (record(); as _record) {
  @for (kv of _record | keyvalue; track kv.key) {
    @if (edit().icons[kv.key]?.url; as url) {
      <lab-icon
        [value]="url"
        type="img"
        [text]="kv.value?.toString()"
      ></lab-icon>
    }
  } @empty {
    <fa-icon class="px-1.5" [icon]="faPlus"></fa-icon>
  }
} @else {
  <fa-icon [icon]="faPlus"></fa-icon>
}
