@if (record(); as _record) {
  @for (kv of _record | keyvalue; track kv.key) {
    @if (edit().icons[kv.key]?.url; as url) {
      <lab-icon [value]="url" type="img" [text]="kv.value?.toString()" />
    }
  } @empty {
    <fa-icon class="px-1.5" [icon]="faPlus" />
  }
} @else {
  <fa-icon [icon]="faPlus" />
}
