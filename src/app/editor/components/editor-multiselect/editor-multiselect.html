<lab-select
  [labelledBy]="labelledBy()"
  [options]="options()"
  [ngModel]="editValue()"
  (ngModelChange)="value.set($event.length ? $event : undefined)"
>
  @for (id of editValue(); track id) {
    @let option = id | option: options();
    @if (option?.icon) {
      <lab-icon
        [value]="option.icon"
        type="img"
        [class]="option.iconClass"
        [iconText]="option.iconText"
      />
    } @else {
      <span>{{ id }}</span>
    }
  } @empty {
    <span class="mx-1 text-gray-400 italic">{{ 'none' | translate }}</span>
  }
</lab-select>
