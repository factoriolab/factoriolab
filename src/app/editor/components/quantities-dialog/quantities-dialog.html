<table class="lab-table">
  <thead>
    <tr>
      <th id="item-header">{{ 'editor.item' | translate }}</th>
      <th id="quantity-header">{{ 'objectives.quantity' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <div class="flex items-center">
          <lab-select
            labelledBy="item-header"
            class="w-full"
            [options]="data.options"
            [(ngModel)]="model.key"
          />
        </div>
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="quantity-header"
          class="input"
          size="3"
          [placeholder]="'objectives.quantity' | translate"
          [ngModel]="model.value"
          [ngModelOptions]="{ updateOn: 'blur' }"
          (ngModelChange)="model.value = toNumeric($event)"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          [aria-label]="'save' | translate"
          (click)="data.record[model.key] = model.value"
        ></button>
      </td>
    </tr>
    @for (kv of data.record | keyvalue; track kv.key) {
      <tr>
        <td>
          <div class="flex items-center">
            <lab-select
              labelledBy="item-header"
              class="w-full"
              [options]="data.options"
              [ngModel]="kv.key"
              (ngModelChange)="updateKey(kv.key, $event)"
            />
          </div>
        </td>
        <td>
          <input
            type="text"
            aria-labelledby="quantity-header"
            class="input"
            size="3"
            [placeholder]="'objectives.quantity' | translate"
            [ngModel]="kv.value"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="data.record[kv.key] = toNumeric($event)"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            [aria-label]="'delete' | translate"
            (click)="remove(kv.key)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>

<div class="gap-1 sm:gap-2 flex justify-end">
  <button
    type="button"
    labButton
    color="complement"
    [faIcon]="faTrash"
    [text]="'delete' | translate"
    (click)="dialogRef.close(null)"
  ></button>
  <button
    type="button"
    labButton
    color="brand"
    [faIcon]="faFloppyDisk"
    [text]="'save' | translate"
    (click)="dialogRef.close(data.record)"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faXmark"
    [text]="'cancel' | translate"
    (click)="dialogRef.close()"
  ></button>
</div>
