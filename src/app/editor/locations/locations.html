<table class="lab-table">
  <thead>
    <tr>
      <th></th>
      <th id="id-header">{{ 'editor.id' | translate }}</th>
      <th id="name-header">{{ 'data.name' | translate }}</th>
      <th id="icon-header">{{ 'editor.icon' | translate }}</th>
      <th id="icon-text-header">{{ 'editor.iconText' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody cdkDropList (cdkDropListDropped)="drop($event)">
    <tr>
      <td></td>
      <td>
        <input
          type="text"
          aria-labelledby="id-header"
          class="input"
          [placeholder]="'editor.id' | translate"
          [(ngModel)]="model.id"
        />
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="name-header"
          class="input"
          [placeholder]="'data.name' | translate"
          [(ngModel)]="model.name"
        />
      </td>
      <td>
        <div class="flex items-center">
          <lab-select
            labelledBy="icon-header"
            [options]="iconOptions()"
            [iconOnly]="true"
            [(ngModel)]="model.icon"
          />
        </div>
      </td>
      <td>
        <input
          type="text"
          aria-labelledby="icon-text-header"
          class="input"
          size="2"
          [placeholder]="'editor.iconText' | translate"
          [(ngModel)]="model.iconText"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          color="brand"
          [aria-label]="'save' | translate"
          (click)="add()"
        ></button>
      </td>
    </tr>
    @for (
      location of edit().data.locations ?? [];
      track location.id;
      let index = $index
    ) {
      <tr cdkDrag cdkDragLockAxis="y">
        <td
          cdkDragHandle
          class="cursor-grab hover:bg-gray-800 active:cursor-grabbing"
        >
          <fa-icon [icon]="faGrip" />
          <ng-container *cdkDragPreview>
            <div
              class="gap-2 rounded-xs p-2 flex items-center border border-gray-700 bg-gray-900"
            >
              <fa-icon [icon]="faGrip" />
              <img
                class="w-8"
                [src]="edit().icons[location.icon ?? location.id]?.url"
                [alt]="location.name"
              />
              <span>{{ location.name }}</span>
            </div>
          </ng-container>
        </td>
        <td>
          <input
            type="text"
            aria-labelledby="id-header"
            class="input"
            [placeholder]="'editor.id' | translate"
            [ngModel]="location.id"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="updateId(location, $event)"
          />
        </td>
        <td>
          <input
            type="text"
            aria-labelledby="name-header"
            class="input"
            [placeholder]="'data.name' | translate"
            [(ngModel)]="location.name"
          />
        </td>
        <td>
          <div class="flex items-center">
            <lab-select
              labelledBy="icon-header"
              [options]="iconOptions()"
              [iconOnly]="true"
              [ngModel]="location.icon ?? location.id"
              (ngModelChange)="
                location.icon = $event === location.id ? undefined : $event
              "
            />
          </div>
        </td>
        <td>
          <input
            type="text"
            aria-labelledby="icon-text-header"
            class="input"
            size="2"
            [placeholder]="'editor.iconText' | translate"
            [(ngModel)]="location.iconText"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [cdkMenuTriggerFor]="editMenu"
            [faIcon]="faEllipsis"
            [aria-label]="'edit' | translate"
          ></button>
          <ng-template #editMenu>
            <div
              class="rounded-xs py-1 flex flex-col border border-gray-600 bg-ground-950"
              cdkMenu
            >
              <button
                type="button"
                labButton
                cdkMenuItem
                [border]="false"
                [faIcon]="faPlus"
                text="editor.clone"
                textAlign="left"
                (click)="clone(location, index)"
              ></button>
              <button
                type="button"
                labButton
                cdkMenuItem
                [border]="false"
                [faIcon]="faTrash"
                color="complement"
                text="delete"
                textAlign="left"
                (click)="remove(location.id)"
              ></button>
            </div>
          </ng-template>
        </td>
      </tr>
    }
  </tbody>
</table>
