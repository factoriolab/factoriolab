<div>
  <button
    type="button"
    labButton
    text="editor.chooseImages"
    [faIcon]="faUpload"
    (click)="filesInput.click()"
  ></button>
</div>
<input
  #filesInput
  type="file"
  accept="image/*"
  multiple
  aria-labelledby="image-header"
  class="hidden"
  (change)="selectFiles($event)"
  (click)="filesInput.value = ''"
/>

<table class="table">
  <thead>
    <tr>
      <th id="id-header">{{ 'editor.id' | translate }}</th>
      <th id="image-header">{{ 'editor.image' | translate }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <input
          #id
          type="text"
          aria-labelledby="id-header"
          class="input"
          [placeholder]="'editor.id' | translate"
        />
      </td>
      <td>
        <div class="gap-2 flex items-center">
          <button
            type="button"
            labButton
            text="editor.chooseImage"
            [faIcon]="faUpload"
            (click)="fileInput.click()"
          ></button>
          @if (fileInfo(); as info) {
            <img [src]="info.url" alt="file image" />
          }
        </div>
        <input
          #fileInput
          type="file"
          accept="image/*"
          aria-labelledby="image-header"
          class="hidden"
          (change)="selectFile($event)"
          (click)="fileInput.value = ''"
        />
      </td>
      <td>
        <button
          type="button"
          labButton
          [faIcon]="faFloppyDisk"
          [aria-label]="'save' | translate"
          (click)="add(id.value, fileInfo())"
        ></button>
      </td>
    </tr>
    @for (icon of edit().data.icons; track icon.id) {
      <tr>
        <td>
          <input
            type="text"
            class="input"
            [ngModel]="icon.id"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (ngModelChange)="changeId(icon, $event)"
          />
        </td>
        <td>
          <button
            type="button"
            class="cursor-pointer"
            (click)="fileInput.click()"
          >
            <img [src]="edit().icons[icon.id]?.url" [alt]="icon.id" />
          </button>
          <input
            #fileInput
            type="file"
            accept="image/*"
            class="hidden"
            (change)="changeImage(icon, $event)"
            (click)="fileInput.value = ''"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faTrash"
            [aria-label]="'delete' | translate"
            (click)="remove(icon.id)"
          ></button>
        </td>
      </tr>
    }
  </tbody>
</table>
