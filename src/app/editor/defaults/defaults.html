<div class="gap-2 flex flex-col self-start">
  <lab-form-field label="editor.researchedTechnologies">
    <lab-editor-multiselect
      [options]="technologyOptions()"
      [(value)]="defaults.researchedTechnologies"
    />
  </lab-form-field>

  <lab-form-field label="editor.excludedRecipes">
    <lab-editor-multiselect
      [options]="recipeOptions()"
      [(value)]="defaults.excludedRecipes"
    />
  </lab-form-field>

  <lab-form-field label="settings.modifierRank">
    <lab-editor-rank-select
      [options]="moduleOptions()"
      emptyMessage="settings.modifierRankEmpty"
      [(value)]="defaults.moduleRank"
    />
  </lab-form-field>

  <lab-form-field label="settings.fuelRank">
    <lab-editor-rank-select
      [options]="fuelOptions()"
      emptyMessage="settings.fuelRankEmpty"
      [(value)]="defaults.fuelRank"
    />
  </lab-form-field>

  <lab-form-field label="data.beacon">
    <lab-select
      placeholder="none"
      [options]="nullableBeaconOptions()"
      [(ngModel)]="defaults.beacon"
    />
  </lab-form-field>

  <lab-form-field label="editor.beaconModule">
    <lab-select
      placeholder="none"
      [options]="nullableModuleOptions()"
      [(ngModel)]="defaults.beaconModule"
    />
  </lab-form-field>

  <lab-form-field label="settings.wagonRank">
    <lab-editor-rank-select
      placeholder="settings.wagonRankEmpty"
      [options]="wagonOptions()"
      [(ngModel)]="defaults.wagonRank"
    />
  </lab-form-field>

  <div>
    <label for="mining-productivity" class="text-sm mx-1 text-gray-300">{{
      'settings.miningProductivity' | translate
    }}</label>
    <input
      id="mining-productivity"
      type="text"
      class="input"
      [placeholder]="'settings.miningProductivity' | translate"
      [ngModel]="defaults.miningBonus"
      [ngModelOptions]="{ updateOn: 'blur' }"
      (ngModelChange)="defaults.miningBonus = toNumeric($event)"
    />
  </div>

  <div>
    <label for="research-bonus" class="text-sm mx-1 text-gray-300">{{
      'settings.researchSpeed' | translate
    }}</label>
    <input
      id="research-bonus"
      type="text"
      class="input"
      [placeholder]="'settings.researchSpeed' | translate"
      [ngModel]="defaults.researchBonus"
      [ngModelOptions]="{ updateOn: 'blur' }"
      (ngModelChange)="defaults.researchBonus = toNumeric($event)"
    />
  </div>

  <div>
    <label for="research-productivity" class="text-sm mx-1 text-gray-300">{{
      'settings.researchProductivity' | translate
    }}</label>
    <input
      id="research-productivity"
      type="text"
      class="input"
      [placeholder]="'settings.researchProductivity' | translate"
      [ngModel]="defaults.researchProductivity"
      [ngModelOptions]="{ updateOn: 'blur' }"
      (ngModelChange)="defaults.researchProductivity = toNumeric($event)"
    />
  </div>

  <div class="flex flex-col">
    <label for="recipe-productivity" class="text-sm mx-1 text-gray-300">{{
      'data.recipeProductivity' | translate
    }}</label>
    <button
      id="recipe-productivity"
      type="button"
      labQuantitiesButton
      [edit]="edit()"
      [record]="defaults.recipeProductivity"
      [attr.aria-label]="'data.recipeProductivity' | translate"
      (click)="editRecipeProductivity(defaults)"
    ></button>
  </div>
</div>

<div class="gap-2 flex items-center self-start">
  <lab-checkbox
    [iconMap]="radioIconMap"
    label="editor.hardCodedPresets"
    [ngModel]="hardCodedPresets != null"
    (ngModelChange)="switchType(!$event)"
  />
  <lab-checkbox
    [iconMap]="radioIconMap"
    label="editor.customPresets"
    [ngModel]="customPresets != null"
    (ngModelChange)="switchType($event)"
  />
</div>

@if (hardCodedPresets) {
  <div class="gap-2 flex flex-col self-start">
    <lab-form-field label="editor.minBeltRank">
      <lab-editor-rank-select
        placeholder="settings.beltRankEmpty"
        [options]="beltOptions()"
        [(ngModel)]="hardCodedPresets.minBeltRank"
      />
    </lab-form-field>

    <lab-form-field label="editor.maxBeltRank">
      <lab-editor-rank-select
        placeholder="settings.beltRankEmpty"
        [options]="beltOptions()"
        [(ngModel)]="hardCodedPresets.maxBeltRank"
      />
    </lab-form-field>

    <lab-form-field label="editor.minMachineRank">
      <lab-editor-rank-select
        [options]="machineOptions()"
        [(value)]="hardCodedPresets.minMachineRank"
      />
    </lab-form-field>

    <lab-form-field label="editor.maxMachineRank">
      <lab-editor-rank-select
        [options]="machineOptions()"
        [(value)]="hardCodedPresets.maxMachineRank"
      />
    </lab-form-field>
  </div>
} @else if (customPresets) {
  <div class="gap-2 flex flex-col self-start">
    <lab-form-field label="settings.locations">
      <lab-editor-multiselect
        [options]="locationOptions()"
        [(value)]="customPresets.locations"
      />
    </lab-form-field>

    <lab-form-field label="settings.beltRank">
      <lab-editor-rank-select
        placeholder="settings.beltRankEmpty"
        [options]="beltOptions()"
        [(ngModel)]="customPresets.beltRank"
      />
    </lab-form-field>

    <div>
      <label for="belt-stack" class="text-sm mx-1 text-gray-300">{{
        'data.beltStack' | translate
      }}</label>
      <input
        id="belt-stack"
        type="text"
        class="input"
        [placeholder]="'data.beltStack' | translate"
        [ngModel]="customPresets.beltStack"
        [ngModelOptions]="{ updateOn: 'blur' }"
        (ngModelChange)="customPresets.beltStack = toNumeric($event)"
      />
    </div>

    <lab-form-field label="settings.machineRank">
      <lab-editor-rank-select
        [options]="machineOptions()"
        [(value)]="customPresets.machineRank"
      />
    </lab-form-field>

    <div>
      <label for="beacon-count" class="text-sm mx-1 text-gray-300">{{
        'editor.beaconCount' | translate
      }}</label>
      <input
        id="beacon-count"
        type="text"
        class="input"
        [placeholder]="'editor.beaconCount' | translate"
        [ngModel]="customPresets.beaconCount"
        [ngModelOptions]="{ updateOn: 'blur' }"
        (ngModelChange)="customPresets.beaconCount = toNumeric($event)"
      />
    </div>
  </div>

  <table class="lab-table">
    <thead>
      <tr>
        <th colspan="21">Custom presets</th>
      </tr>
      <tr>
        <th></th>
        <th id="id-header">{{ 'editor.id' | translate }}</th>
        <th id="name-header">{{ 'data.name' | translate }}</th>
        <th></th>
      </tr>
    </thead>
    <tbody cdkDropList (cdkDropListDropped)="drop(customPresets, $event)">
      <tr>
        <td></td>
        <td class="min-w-40">
          <input
            type="number"
            aria-labelledby="id-header"
            class="input"
            size="3"
            [placeholder]="'editor.id' | translate"
            [(ngModel)]="model.id"
          />
        </td>
        <td class="min-w-60">
          <input
            type="text"
            aria-labelledby="name-header"
            class="input"
            [placeholder]="'data.name' | translate"
            [(ngModel)]="model.label"
          />
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faPencil"
            [aria-label]="'edit' | translate"
            (click)="editPreset(customPresets, model)"
          ></button>
        </td>
        <td>
          <button
            type="button"
            labButton
            [faIcon]="faFloppyDisk"
            color="brand"
            [aria-label]="'save' | translate"
            (click)="addPreset(customPresets)"
          ></button>
        </td>
      </tr>
      @for (
        preset of customPresets.presets;
        track preset.id;
        let index = $index
      ) {
        <tr cdkDrag cdkDragLockAxis="y">
          <td
            cdkDragHandle
            class="cursor-grab hover:bg-gray-800 active:cursor-grabbing"
          >
            <fa-icon [icon]="faGrip" />
            <ng-container *cdkDragPreview>
              <div
                class="gap-2 rounded-xs p-2 flex items-center border border-gray-700 bg-gray-900"
              >
                <fa-icon [icon]="faGrip" />
                <span>{{ preset.label }}</span>
              </div>
            </ng-container>
          </td>
          <td>
            <input
              type="number"
              aria-labelledby="id-header"
              class="input"
              size="3"
              [placeholder]="'editor.id' | translate"
              [(ngModel)]="preset.id"
            />
          </td>
          <td>
            <input
              type="text"
              aria-labelledby="name-header"
              class="input"
              [placeholder]="'data.name' | translate"
              [(ngModel)]="preset.label"
            />
          </td>
          <td>
            <button
              type="button"
              labButton
              [faIcon]="faPencil"
              [aria-label]="'edit' | translate"
              (click)="editPreset(customPresets, preset, index)"
            ></button>
          </td>
          <td>
            <button
              type="button"
              labButton
              [faIcon]="faTrash"
              color="complement"
              [aria-label]="'delete' | translate"
              (click)="removePreset(customPresets, preset.id)"
            ></button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
