<h2 class="text-2xl font-light">FactorioLab Data Editor</h2>

<div class="gap-2 flex items-center">
  <button
    type="button"
    labButton
    [faIcon]="faDownload"
    text="Load existing data"
    (click)="download()"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faUpload"
    text="Upload custom files"
    (click)="upload()"
  ></button>
  <button
    type="button"
    labButton
    [faIcon]="faRotateLeft"
    text="Reset"
    (click)="reset()"
  ></button>
</div>

<div>
  <div class="mb-1 sm:mb-2">
    <lab-tabs [tabs]="tabs"></lab-tabs>
  </div>
  <router-outlet [routerOutletData]="data()" />
</div>
